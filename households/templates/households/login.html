{% extends "base.html" %}

{% block title %}Zaloguj się — Domowa Apteka{% endblock %}

{% block content %}
    <h1>Zaloguj się</h1>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Zaloguj się</button>
    </form>
    <p>Nie masz jeszcze konta? <a href="{% url 'households:signup' %}">Załóż konto</a></p>
    <p><small>Resetowanie hasła nie jest jeszcze dostępne.</small></p>
{% endblock %}
