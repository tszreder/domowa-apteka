[project]
name = "domowa-apteka"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2.16",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
files = ["households", "registry", "domowa_apteka"]

[tool.django-stubs]
django_settings_module = "domowa_apteka.settings"
