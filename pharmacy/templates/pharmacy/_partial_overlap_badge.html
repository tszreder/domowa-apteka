{% if group.partners %}
    <details open class="partial-overlap-badge">
        <summary>Częściowo wspólne substancje z innymi lekami</summary>
        <ul class="partial-overlap-detail">
            {% for substance_name, partner_names in group.partners.items %}
                <li>{{ substance_name }}: {{ partner_names|join:", " }}</li>
            {% endfor %}
        </ul>
    </details>
{% endif %}
